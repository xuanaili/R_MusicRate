[pytest]
# 只收集 backend/tests/：便携Python的 site-packages 里 setuptools 自带 test_*.py，
# 不从根目录收集会误入并报错（41个errors）
testpaths = backend/tests
# realdata 标记的集成测试默认跳过，用 -m realdata 单独跑
addopts = -m "not realdata"
markers =
    realdata: 依赖真实 MySQL/网络的集成测试，默认跳过（portable\python\python.exe -m pytest -m realdata）
